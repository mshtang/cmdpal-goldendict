name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run core tests
        shell: pwsh
        run: |
          dotnet build PaletteDictionary.sln -c Release --nologo -warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Test.ps1
      - name: Get portable Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = ./scripts/Get-InnoSetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'inno-setup')
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build development installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Test published extension with a synthetic dictionary
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'cmdpal-smoke/config.json'
          & ./tests/PaletteDictionary.Tests/bin/Release/net10.0/PaletteDictionary.Tests.exe --write-smoke-config $config
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./tests/PaletteDictionary.Smoke/bin/Release/net10.0-windows10.0.26100.0/PaletteDictionary.Smoke.exe ./artifacts/installer-payload/win-x64/PaletteDictionary.Extension.exe $config en
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-installer-x64
          path: artifacts/installers/*
          if-no-files-found: error
          retention-days: 14
